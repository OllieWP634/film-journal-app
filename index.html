<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Filmlytic</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="header">
        <div class="header-center">
            <h1>FILMLYTIC</h1>
        </div>
        <div class="header-right">
            <a href="#"><h4>CREATE ACCOUNT</h4></a>
            <a href="#"><h4>SIGN <INput:color></INput:color></h4></a>
        </div>
    </div>

    <div class="landing-page">

        <div class="landing-page-header">
            <h2>Track and Analyse Your Favourite Films</h2>
            <p>Log films you've watched and get personalized recommendations.</p>
        </div>

        <div id="underline"></div>

        <div class="carousel-container">

                <div class="poster" id="batman"></div>
                <div class="poster" id="inception"></div>
                <div class="poster" id="lord-of-the-rings"></div>
                <div class="poster" id="pulp-fiction"></div>
                <div class="poster" id="shawshank"></div>
                <div class="poster" id="star-wars"></div>
            </div>
        </div>

        <div class="analyse-button">
            <button>ANALYSE MY TASTE AND GENERATE RECOMMENDATIONS</button>
        </div>

    </div>
    
</body>
</html>
